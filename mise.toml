[settings]
task.run_auto_install = false

[tools]
jq = "1.8.2"
shellcheck = "0.11.0"

[tasks.check]
description = "Shellcheck every tracked shell script and resolve every relative Markdown link; reads no network, writes nothing"
run = "scripts/check.sh"

[tasks.currency]
description = "Report every mise tool and action pin behind its latest, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
quiet = true
