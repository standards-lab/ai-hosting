[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.22.0", version_prefix = "marathon/v" }
jq = "1.8.2"
shellcheck = "0.11.0"

[tasks.check]
description = "Shellcheck every tracked shell script, resolve every relative Markdown link, and run lint-context and lint-references; reads no network, since no task installs a missing tool, and writes nothing"
run = "scripts/check.sh"

[tasks.currency]
description = "Report every mise tool and action pin behind its latest, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
quiet = true
