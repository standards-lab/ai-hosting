min_version = "2026.10.4"

[settings]
experimental = true
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.23.0", version_prefix = "marathon/v" }
"aqua:FiloSottile/age" = "1.3.2"
fnox = "1.50.0"
jq = "1.8.2"
"pipx:huggingface_hub" = "2.4.0"
shellcheck = "0.11.0"
uv = "0.13.9"
yq = "4.54.3"

[secrets.fnox]

[tasks.check]
description = "Shellcheck every tracked shell script, resolve every relative Markdown link, run lint-context, lint-references, lint-secrets, hosting profile validate on every class profile, and the shell tests; reads no network, since no task installs a missing tool, and writes nothing"
run = "scripts/check.sh"

[tasks.currency]
description = "Report every mise tool and action pin, the vLLM release, and each built image's base digest and Python pins behind its latest, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
quiet = true

[tasks.install]
description = "Link ~/.local/bin/hosting to this clone's hosting command, refusing when that path holds anything else; writes only the link"
run = "scripts/install.sh"

[tasks.uninstall]
description = "Remove ~/.local/bin/hosting when it links into this clone, leaving anything else in place; writes only that removal"
run = "scripts/uninstall.sh"
