# The embedding row at its load target: a constant rate, given per level, at most 16 requests in
# flight, for 240 s, each request 510 synthetic tokens. See bench/README.md.
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
  profile:
    kind: constant
    max_concurrency: 16
  data:
    - kind: synthetic_text
      prompt_tokens: 510
  constraints:
    - kind: max_duration
      seconds: 240
