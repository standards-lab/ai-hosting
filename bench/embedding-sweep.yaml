# The embedding row at 1, 4, 16, 32, 64 and 128 concurrent streams, 30 s a level, each request 510
# synthetic tokens. See bench/README.md.
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
  profile:
    kind: concurrent
    streams: [1, 4, 16, 32, 64, 128]
  data:
    - kind: synthetic_text
      prompt_tokens: 510
  constraints:
    - kind: max_duration
      seconds: 30
