# The agent row at 4 and 12 concurrent sessions, 110 s a level, each a 4-turn synthetic session:
# a first turn of 8,192 prompt tokens, then three of 512, every turn exactly 512 output tokens.
# See bench/README.md.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: [4, 12]
  data:
    - kind: synthetic_text
      turns: 4
      first_prompt_tokens: 8192
      prompt_tokens: 512
      output_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 110
