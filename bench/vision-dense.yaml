# The vision row at 2, 4 and 8 concurrent streams, 10 min a level, each request one of docinfer's
# dense pages with docinfer's prompt, card sampling and reply bound, read from the rows
# bench/docinfer-inputs.sh writes. See bench/README.md.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    max_tokens: 2048
    extras:
      body:
        temperature: 1.0
        top_p: 0.95
        top_k: 64
  profile:
    kind: concurrent
    streams: [2, 4, 8]
  data:
    - kind: json_file
      path: .state/bench/docinfer/dense-pages.jsonl
  data_column_mapper:
    kind: generative_column_mapper
    column_mappings:
      text_column: 0.prompt
      image_column: 0.image
  data_preprocessors:
    - kind: encode_media
  constraints:
    - kind: max_duration
      seconds: 600
