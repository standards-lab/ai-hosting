# The embedding row at a constant rate for 240 s, the rate given per run, each request 510
# synthetic tokens. See bench/README.md.
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
  profile:
    kind: constant
  data:
    - kind: synthetic_text
      prompt_tokens: 510
  constraints:
    - kind: max_duration
      seconds: 240
