port = 9100
context = 8192
card_context = 262144
context_reason = "The context's measurement, in its document."
cap = 16
cap_reason = "The cap's measurement, in its document."
queue_limit = 32
fraction = 0.4
fraction_reason = "The fraction's measurement, in its document."
flags = ["--scheduling-policy", "priority", "--kv-cache-dtype", "bfloat16"]
