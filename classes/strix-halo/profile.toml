# The strix-halo host class's profile: every row a Strix Halo host can serve, each row's one home.
# See classes/README.md.
store = "/srv/models"

[[rows]]
alias = "audio"
model = "google/gemma-4-E4B-it"
container = "vllm-audio"
port = 8002
image = "ai-hosting/vllm-openai-rocm-audio"
context = 8192
card_context = 131072
context_reason = "8,192 tokens a request, the length every capability row was measured at (spike-model-layout docs/findings/capability-vllm.md) and every audio capacity cell ran at; the model caps audio at 30 s, 750 audio tokens, so a request stays far below it: the 30 s probe clip took 768 prompt tokens (docs/findings/audio.md#audio-probe)."
cap = 48
cap_reason = "48 requests at once, the row's throughput peak, set by throughput, the clips the row processes over time: on docinfer's real windows of 28 to 30 s, the longest clip the model transcribes whole and so its heaviest request (docs/findings/audio.md#audio-probe), 48 streams cleared 2.133 and 2.044 requests a second on the second-half rate, 8% and 13% over 32 streams' 1.889, and 64 streams 2.111, within the host's 4.4% run noise of 48's highest at 1.4 times the latency; 2.013 to 2.040 over 600 s beside the layout's other rows (docs/findings/audio.md#audio-real-30s, #audio-real-30s-64, #audio-noise, #layout). The cells report RTFx too, but it doesn't set the cap."
queue_limit = 192
queue_limit_reason = "192 requests, four times the cap: past its queue limit the row answers 503 and the gateway overflows audio to Azure's gpt-audio-mini, a different model, so a deeper queue keeps bursts on the local model (docs/gateway.md, \"Row refusals, retry, and health\" and \"Overflow\"). The limit counts requests in flight, running and waiting together as vLLM admits them, so 144 wait: at the 2.04 requests a second of docinfer's windows at 48 streams, the 144th waiting request waits about 71 s, worked out from that rate rather than measured (docs/findings/audio.md#layout, docs/findings/gateway.md#the-queue-limit-counts-running-requests)."
fraction = 0.30
fraction_reason = "0.30: its KV cache held 431,113 tokens, 52.63 requests of 8,192, over the cap of 48, and the host's MemAvailable fell no lower than 78.15 GiB through the start and 76.37 GiB under the layout's load, against the 12.5 GiB floor (spike-model-layout docs/findings/vllm-layout.md, \"Reading the figures\"); a request of docinfer's windows takes about 890 tokens with its reply, a small part of the cache (docs/findings/audio.md#audio-start, #audio-real-30s, #layout)."
flags = ["--kv-cache-dtype", "bfloat16", "--reasoning-parser", "gemma4", "--enable-auto-tool-choice", "--tool-call-parser", "gemma4"]
flags_reason = "A BF16 KV cache, which every Gemma 4 row keeps (spike-model-engines host/vllm-rows), and Gemma 4's own reasoning and tool-call parsers."
measured_vllm = "v0.34.0"

[rows.load]
target = "48 streams"
source = "docs/findings/audio.md#audio-real-30s and #layout: docinfer's real windows of 28 to 30 s, the heaviest request, at 48 streams cleared 2.133 requests a second on the second-half rate alone, latency median 24.66 s and p90 35.30 s, and 2.013 to 2.040 over 600 s beside the layout's other rows, latency median about 24 s and p90 about 29 s"

[rows.source]
publisher = "Google"
origin = "United States"
licence = "Apache-2.0"
card_url = "https://huggingface.co/google/gemma-4-E4B-it"
[[rows]]
alias = "embedding"
model = "intfloat/multilingual-e5-large"
container = "vllm-embed"
port = 8003
context = 512
card_context = 512
context_reason = "512 tokens, the card's limit, past which it truncates: a 510-token input, 512 with its 2 special tokens, embedded, and a 511-token one was refused (docs/findings/embedding.md#e5-card, #e5-probes)."
cap = 16
cap_reason = "16 requests at once, the load target: alone on framework-2 on the LAN the row peaks at 4 streams, 82 requests a second, and holds 77 at 16; at cap 16 it holds 73 at 32, 64, and 128 streams, queueing what it does not run, where cap 32 fell to 68 and then 62 (docs/findings/embedding.md#e5-lan-sweep, #e5-lan-sweep-16)."
fraction = 0.03
fraction_reason = "0.03: on the pooling runner the row keeps no KV pool; e5 started within it, its weights taking 1.08 GiB, and at cap 32 its GTT peaked at 2,554 MiB under the sweep, within the 3,441 MiB it reserves; alone on framework-2 after its rate sweep it held 2,176 MiB, and the host's pool used 2.46 of 112 GiB (docs/findings/embedding.md#e5-update, #e5-sweep-32, #e5-memory, #e5-rate-sweep)."
dims = 1024
flags = ["--runner", "pooling", "--max-num-batched-tokens", "65536"]
flags_reason = "The pooling runner, which serves embeddings, and 65,536 batched tokens a step, since vLLM's default of 8,192 batches only 16 of the embedding cells' 512-token inputs (spike-model-layout docs/findings/capability-vllm.md, G). e5 ran on both flags in its sweeps with no error or preemption: at cap 128 its 128 inputs of 512 tokens fill the 65,536 a step, and at cap 32 they take 16,384 of it (docs/findings/embedding.md#e5-sweep-128, #e5-sweep-32)."
measured_vllm = "v0.34.0"

[rows.load]
target = "16 streams, at most 78 requests a second"
source = "docs/findings/embedding.md#e5-lan-sweep, #e5-rate-sweep, #e5-target and #layout: alone on its host on the LAN, 78.4 requests a second at 16 streams, within 5% of the peak of 82.2 at 4, with no error; at 16 in flight, every constant rate up to 77.10 achieved at least 99.9% with no error, and 78.76 achieved 77.96, 99.0%, so the highest rate the row keeps with no error and at least 98% achieved is 78; held at 78 for 600 s, 77.96 alone and 77.11 to 77.87 beside the layout's other rows"

[rows.source]
publisher = "Microsoft"
origin = "United States"
licence = "MIT"
card_url = "https://huggingface.co/intfloat/multilingual-e5-large"
