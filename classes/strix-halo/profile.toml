# The strix-halo host class's profile: every row a Strix Halo host can serve, each row's one home.
# See classes/README.md.
store = "/srv/models"

[[rows]]
alias = "audio"
model = "google/gemma-4-E4B-it"
container = "vllm-audio"
port = 8002
image = "ai-hosting/vllm-openai-rocm-audio"
context = 8192
card_context = 131072
context_reason = "8,192 tokens a request, the length every capability row was measured at (spike-model-layout docs/findings/capability-vllm.md); the row runs alone on its host and was measured at this context with 8 streams of short LibriSpeech clips, about 200 prompt tokens each (docs/findings/audio.md#audio-8)."
cap = 32
cap_reason = "32 requests at once, an interim setting the audio capacity sweeps run at, the highest of their levels: at 32 streams the row served 9.13 short clips a second and 1.78 windows of 30 s, with no preemption, the most of any level, and met audio's floor only at 4 (docs/findings/audio.md#audio-capacity-short, #audio-capacity-30s)."
queue_limit = 64
fraction = 0.28
fraction_reason = "0.28, an interim setting the audio capacity sweeps run at, sized to hold 32 requests of 8,192 tokens, 262,144: its KV cache held 372,696 tokens, 45.50 requests of 8,192, and through its start and both sweeps the host's MemAvailable stayed at or above 77.76 GiB and its GTT available at or above 80.77 (docs/findings/audio.md#audio-capacity-short, #audio-capacity-30s)."
flags = ["--kv-cache-dtype", "bfloat16", "--reasoning-parser", "gemma4", "--enable-auto-tool-choice", "--tool-call-parser", "gemma4"]
flags_reason = "A BF16 KV cache, which every Gemma 4 row keeps (spike-model-engines host/vllm-rows), and Gemma 4's own reasoning and tool-call parsers."
measured_vllm = "v0.34.0"

[rows.load]
target = "8 streams"
source = "docs/findings/audio.md#audio-8: the row alone on its host at 8 streams; spike-model-layout docs/findings/vllm-layout.md, F.5: an RTFx median of 4.94 at 8 streams beside the earlier embedding row at 34 requests a second; standards-lab context/ai-hosting.md, \"The layout\""

[rows.source]
publisher = "Google"
origin = "United States"
licence = "Apache-2.0"
card_url = "https://huggingface.co/google/gemma-4-E4B-it"
[[rows]]
alias = "embedding"
model = "intfloat/multilingual-e5-large"
container = "vllm-embed"
port = 8003
context = 512
card_context = 512
context_reason = "512 tokens, the card's limit, past which it truncates: a 510-token input, 512 with its 2 special tokens, embedded, and a 511-token one was refused (docs/findings/embedding.md#e5-card, #e5-probes)."
cap = 16
cap_reason = "16 requests at once, the load target: alone on framework-2 on the LAN the row peaks at 4 streams, 82 requests a second, and holds 77 at 16; at cap 16 it holds 73 at 32, 64, and 128 streams, queueing what it does not run, where cap 32 fell to 68 and then 62 (docs/findings/embedding.md#e5-lan-sweep, #e5-lan-sweep-16)."
fraction = 0.03
fraction_reason = "0.03: on the pooling runner the row keeps no KV pool; e5 started within it, its weights taking 1.08 GiB, and at cap 32 its GTT peaked at 2,554 MiB under the sweep, within the 3,441 MiB it reserves; alone on framework-2 after its rate sweep it held 2,176 MiB, and the host's pool used 2.46 of 112 GiB (docs/findings/embedding.md#e5-update, #e5-sweep-32, #e5-memory, #e5-rate-sweep)."
dims = 1024
flags = ["--runner", "pooling", "--max-num-batched-tokens", "65536"]
flags_reason = "The pooling runner, which serves embeddings, and 65,536 batched tokens a step, since vLLM's default of 8,192 batches only 16 of the embedding cells' 512-token inputs (spike-model-layout docs/findings/capability-vllm.md, G). e5 ran on both flags in its sweeps with no error or preemption: at cap 128 its 128 inputs of 512 tokens fill the 65,536 a step, and at cap 32 they take 16,384 of it (docs/findings/embedding.md#e5-sweep-128, #e5-sweep-32)."
measured_vllm = "v0.34.0"

[rows.load]
target = "16 streams, at most 78 requests a second"
source = "docs/findings/embedding.md#e5-lan-sweep and #e5-rate-sweep: alone on its host on the LAN, 78.4 requests a second at 16 streams, within 5% of the peak of 82.2 at 4, with no error; at 16 in flight, every constant rate up to 77.10 achieved at least 99.9% with no error, and 78.76 achieved 77.96, 99.0%, so the highest rate the row keeps with no error and at least 98% achieved is 78"

[rows.source]
publisher = "Microsoft"
origin = "United States"
licence = "MIT"
card_url = "https://huggingface.co/intfloat/multilingual-e5-large"
