# The Collector's pipelines: traces to Tempo, metrics to Mimir, and logs to Loki.
# See docs/gateway.md
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  prometheus/agentgateway:
    config:
      scrape_configs:
        - job_name: agentgateway
          scrape_interval: 15s
          static_configs:
            - targets: ["torii:15020"]

  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus_remote_write/mimir:
    endpoint: http://mimir:9009/api/v1/push
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: localhost
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp, prometheus/agentgateway, prometheus/self]
      processors: [batch]
      exporters: [prometheus_remote_write/mimir]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
