# The bench environment: the tools that measure the rows from the laptop, which mise run check never
# installs. See bench/README.md.
[tools]
# Held on 3.14: MTEB 2.27.22 requires Python below 3.15, and torchcodec 0.17.0, which GuideLLM's
# audio extra needs, publishes no wheel for 3.15.
python = "3.14.10"
"pipx:guidellm" = { version = "0.8.1", extras = ["audio"] }
"pipx:mteb" = "2.27.22"
